<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 — 미식장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div id="admin-app">

    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__logo" aria-hidden="true">🛠️</span>
        <span class="topbar__title">미식장 관리자</span>
      </div>
      <a href="index.html" class="icon-btn" style="margin-left:auto;">← 앱으로 돌아가기</a>
      <button id="logout-btn" class="icon-btn" type="button" hidden>로그아웃</button>
    </header>

    <!-- ============ 로그인 화면 ============ -->
    <div id="login-view" class="admin-center">
      <form id="login-form" class="admin-card">
        <p class="admin-card__title">관리자 로그인</p>
        <p class="admin-card__hint">
          Firebase 콘솔의 Authentication에서 직접 만든 관리자 계정으로만 로그인할 수 있습니다.
          이 페이지엔 회원가입 기능이 없습니다.
        </p>
        <div class="field">
          <label class="field__label">이메일</label>
          <input type="email" name="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label class="field__label">비밀번호</label>
          <input type="password" name="password" required autocomplete="current-password" />
        </div>
        <p class="add-form__error" id="login-error" hidden></p>
        <button type="submit" class="btn btn--primary">로그인</button>
      </form>
    </div>

    <!-- ============ 관리자 화면 ============ -->
    <div id="admin-view" hidden>
      <nav class="admin-tabs">
        <button class="admin-tab is-active" data-tab="regions">📍 지역 관리</button>
        <button class="admin-tab" data-tab="categories">🏷️ 음식 태그 관리</button>
        <button class="admin-tab" data-tab="restaurants">🍽️ 맛집 관리</button>
      </nav>

      <section id="tab-regions" class="admin-panel"></section>
      <section id="tab-categories" class="admin-panel" hidden></section>
      <section id="tab-restaurants" class="admin-panel" hidden></section>
    </div>

  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
